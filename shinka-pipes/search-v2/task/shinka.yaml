evo:
  language: cpp
  job_type: local
  llm_models:
  - headless/codex@gpt-6-astra?effort=xhigh
  llm_dynamic_selection: fixed
  llm_kwargs:
    temperatures:
    - 0.0
    max_tokens: 16384
  embedding_model: null
  meta_rec_interval: null
  novelty_llm_models: null
  evolve_prompts: false
  enable_wandb_logging: false
  use_text_feedback: true
  patch_types:
  - diff
  - full
  patch_type_probs:
  - 0.8
  - 0.2
  max_patch_resamples: 1
  max_patch_attempts: 3
  max_novelty_attempts: 1
  task_sys_msg: 'Improve a causal online dynamic storage allocator in self-contained C++20.

    Propose a patch in your response; do not edit files or launch experiments yourself.

    Change only EVOLVE-BLOCK regions. Preserve stdin/stdout protocol and immediate flush.

    Positive commands insert length 1..40; negative commands delete a PID; 0 exits.

    Existing pipes cannot move. Trench grows in sections of 20 and never shrinks.

    Use only past observations; no future input, raw test inspection, test fingerprints,

    filesystem access, network, subprocesses, or external data in the candidate.

    Do not inspect other project results or holdout data. Use supplied code and feedback.

    Every case must satisfy 5 seconds solver CPU and 256 MiB RSS.

    Fitness uses the frozen SEARCH-v2 corpus (128 streams, 16 families, 8 streams each) only. For each
    trace calculate

    B/T, where B=20*ceil(peak_live_volume/20) and T is actual trench length.

    Average over cases within each family, then give every family equal weight.

    Fitness lies in [0,1]; B is a lower bound, not necessarily an achievable optimum.

    Re-evaluate baseline fitness on this same corpus at the start of each run.

    Validation and Open15 are excluded from fitness, selection and your feedback.

    Do not inspect their files or results. Generalization is not established by search gains.

    State the allocator hypothesis behind the change; avoid case-specific hardcoding.


    LITERATURE-INFORMED ALGORITHM SEARCH — prepared 2026-10-18.

    PATCH APPLICATION AND REPAIR. Copy SEARCH context exactly from the supplied original parent, including
    blank lines, indentation and comments. Prefer small unambiguous SEARCH anchors over rewritten surrounding
    context. If application fails, Shinka supplies the precise error plus the parent and previous response
    in conversation history. Return the complete corrected patch, retaining the same allocator hypothesis
    and intended change; do not replace it with an unrelated proposal. Each attempt is applied to the
    original parent again: include every needed SEARCH/REPLACE block, not just the first failing block.
    There are at most three attempts total (original plus two feedback corrections), all under one generation
    ID and one parent. Failed apply attempts are not evaluated or inserted as candidate Programs. After
    exhaustion the v2 runner stops and saves diagnostics before another generation is proposed; do not
    attempt to bypass this limit, inspect data or execute tools yourself.

    The purpose of these papers is practical allocator improvement, not publication novelty.

    Use one substantive mechanism per proposal; identify what is already present in the supplied parent.
    Parameter-only changes do not satisfy this research objective. State hypothesis H1/H2/H3/H4/H5/H6
    (or explain a better causal mechanism), source motivation, expected failure mode, complexity and a
    minimal one-mechanism ablation. Shinka runs the evaluation; do not run tools/experiments yourself.
    These are untested engineering transfers, not promised improvements or transplanted theorems.


    H1 — AGE-CONDITIONAL RELEASE RISK. LAVA, Ling/Worah/Wang et al., MLSys2025, sections3–4: update remaining-life
    predictions after survival, rather than retaining an initial point prediction. In Pipes, estimate
    deletion probability over horizon h conditional on current age a, q=1-S(a+h)/S(a), using past data
    only; live pipes are censored observations, not observed deaths. Coarse classes and at most three
    age-checkpoint events per pipe can bound total extra queue work to O(N log N), with O(N) memory and
    constant-size risk lookup. Do not scan all live pipes per command. Keep the old predictor with insufficient
    evidence. Change only neighbor-release risk; preserve gap utility, growth and side rules. The reviewed
    v1 gen2 already has deaths/exposure rates and DP utility: age-conditional risk is the proposed distinction,
    if missing in the actual parent.

    Source: https://proceedings.mlsys.org/paper_files/paper/2025/file/9de62e421d58234dbf773abf43268630-Paper-Conference.pdf


    H2 — GLOBAL ADDRESS-FIRST-FIT. Ernst/Stolyar/Wang, arXiv2404.03797v3 (Sep2026), theorem4.1: in a stationary
    Poisson/iid/exponential large-system model, address-first-fit asymptotically suppresses relative empty
    space. This is not a guarantee for finite Pipes traces or irrevocable peak trench length. Compare
    an exact leftmost-fitting free interval query to current gap scoring, preserving all other decisions.
    An address-ordered tree augmented by subtree maximum gap length gives O(log G) search/update (expected
    for treap), O(G) memory. A 64-gap prefix scan is an approximation, not exact First-Fit. Handle split/merge
    invariants carefully; inspect family regressions and CPU.

    Source: https://arxiv.org/html/2404.03797v3


    H3 — CORRECT WRONG REGION LIFETIME LABELS. Maas/Andersen/Isard/Javanmard/McKinley/Raffel, ASPLOS2020,
    LLAMA: nonmoving allocation can adjust region lifetime classes when predictions prove wrong. The paper
    uses call-context models and OS page reclamation, which are unavailable/different in Pipes. Modify
    labels and future reuse of already excavated regions only; never relocate live pipes or reserve extra
    trench for prediction. Keep a bounded region count and existing gap-index complexity. Compare the
    same grouping policy with and without correction; do not merely add an arena, grouping already exists
    in reviewed variants.

    Source: https://www.cs.utexas.edu/~mckinley/papers/llama-asplos-2020.pdf


    MODEL BOUNDARIES. LAVA scheduling does not establish a universal rule to group similar lifetimes:
    its main VM policy may mix shorter and longer VMs to avoid prolonging a host''s lifetime. Wilson et
    al.1995 motivate preserving temporal structure and evaluating separate workload families, not assuming
    iid random traces. Futureproof Static Memory Planning/idealloc2025 is offline with all lifetimes known;
    do not copy boxing, future conflicts or future reordering into this online candidate. Buchsbaum et
    al.2004 OPT Versus LOAD explains a lower bound, not that B=20*ceil(peak_live_volume/20) is achievable
    by an online allocator. Scientific novelty and gains on hidden/platform tests are not established
    by this packet or SEARCH gains.


    PRODUCTION ALLOCATOR TRANSFERS — prepared 2026-10-18. malloc is an interface: the implementation reviewed
    here is glibc malloc, not macOS malloc. Reviewed source commits: glibc 04e750e75b73957cf1c791535a3f4319534a52fc;
    jemalloc 7a34f18502e7b222724097cdcd499b437d189acc; mimalloc d4881d338125e1cb7c47ba4cfb398d6f7c0c8d45.
    These mechanisms do not require installing/linking any allocator library. Splitting, coalescing, size
    indices, cohort grouping and a two-front arena are already present in reviewed parent variants; adding
    their names is not a new mechanism.


    H4 — PRESERVE THE EXPANDABLE TAIL. dlmalloc wilderness preservation and glibc _int_malloc/use_top
    motivate preferring existing interior gaps before the free tail ending at trenchLength. Keep the parent''s
    scoring, side choice, growth and special cohort mode constraints unchanged. If any policy-eligible
    interior gap fits, score interior candidates only; otherwise use the tail, then ordinary growth. Check
    interior existence exactly with the size index: the tail is unique, so skip that one element after
    lower_bound if needed. Do not mistake absence from a bounded candidate sample for absence globally.
    Reviewed baseline ordinary scoring and gen2 include tail in the common competition; baseline already
    excludes tail in one narrow counterfactual mode. Skip H4 if equivalent behavior exists in the actual
    parent. O(log G) extra work, O(1) extra state. Failure: using a 30-unit interior gap for request20
    can force later request30 to grow even when request20 could have fitted a 20-unit tail. Ablation changes
    only this interior-before-tail rule; no tail penalty sweep.

    Sources: https://gee.cs.oswego.edu/dl/html/malloc.html ; https://github.com/bminor/glibc/blob/04e750e75b73957cf1c791535a3f4319534a52fc/malloc/malloc.c#L4310


    H5 — FREE-GAP AGE AS A TIE-BREAK. dlmalloc/glibc ordinary-bin FIFO motivates leaving newly freed gaps
    time to coalesce. Among gaps of the same span and equal primary score, prefer the oldest free gap
    rather than address alone. This is free-gap age, not future lifetime. Track freeSince: current command
    when a connected gap is formed by deletion/merging; a split remainder inherits the previous value.
    Maintain a (span, freeSince, address) index, O(log G) updates and O(G) memory. Both ablation arms
    must see identical candidates, including the oldest gap of each considered size; only the tie-break
    differs. gen2 samples address endpoints and uses neighbor-sensitive score, so equal span alone is
    not sufficient to override its score. Do not attribute expanded candidate coverage to FIFO. Failure:
    an old gap can also be about to merge, or address ordering can be better. Keep coalescing immediate;
    do not copy tcache/deferred-free paths.

    Sources: https://gee.cs.oswego.edu/dl/html/malloc.html ; https://github.com/bminor/glibc/blob/04e750e75b73957cf1c791535a3f4319534a52fc/malloc/malloc.c#L1482


    H6 — REUSE A CURRENT EXACT-SIZE REGION, EXPLORATORY. jemalloc uses slabcur then nonfull slabs ordered
    by serial number/address; it does not select the densest slab. mimalloc checks the queue front, then
    a next-fit slow search with a candidate budget after the first candidate and a fuller-page preference.
    For Pipes, test soft region labels and current-region reuse for exact sizes1..40, then previously
    used regions, then the unchanged global selector. Never round occupied pipe lengths or excavate extra
    space for a new region. All free spans remain globally available; exact global fitting-gap fallback
    is mandatory before growth. Labels must not stop coalescing across region boundaries, and live pipes
    never move. A new label only covers space the ordinary placement already uses; existing growth behavior
    must be identical in both ablation arms. At most40 current regions plus a fixed bounded catalogue;
    declare geometry/catalogue/eviction before comparison, no parameter sweep and no per-command live-pipe
    scans. A catalogue scan bounded by a fixed constant plus O(log G) tree operations is acceptable; copying
    an unbounded page-queue scan is not. Distinction: existing baseline cohort slabs depend on runs/parity,
    gen2 arena on deletion groups; neither is this exact-size current-region reuse with shared fallback.
    The ablation changes only region preference with identical indices and growth. Do not add H1/H3/H4
    in the same patch. Failure: equal size does not imply correlated deletions, and survivors can fragment
    a region. This hypothesis has lower priority than the simpler policies.

    Sources: https://github.com/jemalloc/jemalloc/blob/7a34f18502e7b222724097cdcd499b437d189acc/src/bin.c#L289
    ; https://github.com/microsoft/mimalloc/blob/d4881d338125e1cb7c47ba4cfb398d6f7c0c8d45/src/page.c#L944


    TRANSFER LIMITS AND PRIORITY. Suggested consideration order is H4,H5,H2,H1,H3,H6, not an assigned
    schedule or budget. CPU speed alone does not improve B/T. Alignment, rounding, mmap/trim/purge, thread
    caches, remote frees and physical-page reclamation are not Pipes score improvements. Neither publication
    novelty nor hidden-test improvement is implied. jemalloc''s extent ratio cap is conditional on its
    cache/coalescing policy; do not copy its default64 or tune a cutoff as a substitute for an algorithmic
    hypothesis. The user explicitly selected SEARCH-v1 generation 2 as this run''s initial program; it
    is generation 0 here and must be re-evaluated on all SEARCH-v2 cases before evolution. Use its supplied
    code without inspecting the old run. Preserve its existing mechanisms unless your one-mechanism hypothesis
    explicitly changes one. Keep this selected seed, fixed128 SEARCH cases, family weights, resource limits,
    model and authorized 30-generation budget unchanged. Validation and Open15 remain excluded. Each candidate
    and its same-parent ablation must use the same full search suite under the eventual authorized budget;
    do not launch additional evaluations outside that budget.

    '
db:
  num_islands: 2
  archive_size: 20
  num_archive_inspirations: 1
  num_top_k_inspirations: 1
job:
  time: 02:00:00
  numeric_threads_per_job: 1
max_evaluation_jobs: 1
max_proposal_jobs: 1
max_db_workers: 1
verbose: true
